name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only: no secrets, no writes, nothing published.
permissions:
  contents: read

jobs:
  # Home Assistant 2026.10.4 is also the minimum of hacs.json and the README: change
  # them together.
  tests:
    name: Tests and lint (Home Assistant 2026.10.4, Python 3.14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  hassfest:
    name: hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-10-26

  hacs:
    name: HACS
    runs-on: ubuntu-24.04
    steps:
      # Brands: not in home-assistant/brands. The repository's description and topics,
      # also checked, are set on GitHub.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-06-08
        with:
          category: integration
          ignore: brands
          comment: false

  privacy:
    name: Privacy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python tools/privacy_check.py
